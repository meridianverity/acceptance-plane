[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acceptance-plane-public-eval"
version = "1.0.2"
description = "Fresh-archive-verifiable public-evaluation proof overlay for the Acceptance Plane architecture thesis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-4.0"}
authors = [{name = "Scott Lee", email = "security@meridianverity.example"}]
keywords = ["agentic-ai", "acceptance-plane", "public-eval", "verifier-ready-evidence"]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["acceptance_plane_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
